//file:noinspection InconsistentLineSeparators
plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.137'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_version}-neoforge-${minecraft_version}"
}

tasks.named('jar', Jar).configure {
    archiveVersion = ''
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            'mod_version': mod_version,
            'mod_id': mod_id,
            'mod_name': mod_name,
            'mod_authors': mod_authors,
            'mod_description': mod_description,
            'mod_license': mod_license,
            'minecraft_version': minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'neo_version': neo_version,
            'neo_version_range': neo_version_range
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = "${neo_version}"
    validateAccessTransformers = false
    
    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
    }
    
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.main.java {
    exclude 'za/co/infernos/goety/data/**'
    exclude 'za/co/infernos/goety/init/ModLootInject.java'
}

repositories {
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top"
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    flatDir {
        dirs 'runtime-mods'
    }
}

dependencies {
    // Mixin is provided by the NeoForge runtime; we only need the annotations on the compile classpath.
    // The Mixin annotation processor currently fails to remap targets under the NeoForge moddev setup,
    // which blocks compilation. We'll re-enable proper AP/remapping once the mod builds cleanly.
    compileOnly 'org.spongepowered:mixin:0.8.5'

    //JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    //Curios (required)
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curio_version}+${minecraft_version}:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curio_version}+${minecraft_version}")

    //Patchouli - Commented out until 1.21.1 version is available
    //compileOnly("vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}:api")
    //runtimeOnly("vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}")

    //Jade
    //implementation("curse.maven:jade-324717:6855440")

    //Botania - Commented out until 1.21.1 version is available
    //compileOnly("vazkii.botania:Botania:${minecraft_version}-NEOFORGE-SNAPSHOT")

    //Serene Seasons - Commented out until 1.21.1 version is available
    //compileOnly("curse.maven:serene-seasons-291874:5790653")

    //Testing Only — NeoForge 1.21.1 builds
    runtimeOnly("curse.maven:yeetus-635427:5444189")
    runtimeOnly("curse.maven:jeed-532286:7346553")
    runtimeOnly("curse.maven:worldedit-225608:5830452")
    runtimeOnly("curse.maven:mob-battle-mod-268746:7268415")
    runtimeOnly("curse.maven:lionfish-api-1001614:7941057")
    runtimeOnly("maven.modrinth:l_enders-cataclysm:RM2acghH")
    runtimeOnly("curse.maven:kiwi-303657:7666569") // beta channel — only NF 1.21.1 release stream
    runtimeOnly("curse.maven:geckolib-388172:7707149")
    runtimeOnly("curse.maven:born-in-chaos-686437:7917953")
    runtimeOnly("curse.maven:framework-549225:7530361") // beta — Crayfish ships NF as beta
    runtimeOnly("curse.maven:configured-457570:7276577")
    runtimeOnly("curse.maven:spark-361579:6225208")
    runtimeOnly("curse.maven:free-cam-557076:5572364")
    runtimeOnly("curse.maven:puzzles-lib-495476:7140307")
    runtimeOnly("curse.maven:illager-invasion-891324:6492670")
    runtimeOnly("curse.maven:citadel-331936:7476597")
    runtimeOnly("curse.maven:huge-structure-blocks-474114:7065481")
    runtimeOnly("curse.maven:guard-villagers-360203:7704203")
    // Removed — no NeoForge 1.21.1 build available:
    //   retro-damage-indicators-1003431, wiki-zoomer-383277,
    //   illage-and-spillage-finally-ported-1079714, mob-battle-extra-853296,
    //   domestication-innovation-591149
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
